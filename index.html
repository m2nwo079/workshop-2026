<style>
  :root{--ink:#2a2320;--ink-soft:#6b5d54;--paper:#f4f0ea;--paper-edge:#e6ded2;--rule:#cebfad;--wine:#7c2d3a;--wine-soft:#ecd9d5;--gold:#a9761a;--up:#3f6f52;--down:#a13b32;--maxw:760px}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,Roboto,"Helvetica Neue","Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.7;font-size:18px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
  .controls{position:sticky;top:0;z-index:50;background:rgba(244,240,234,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
  .controls-inner{max-width:var(--maxw);margin:0 auto;padding:10px 28px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .toggle-group{display:flex;align-items:center;gap:8px}
  .toggle-group .tlabel{font-size:11px;letter-spacing:.06em;color:var(--ink-soft);font-weight:600}
  .seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:#fff}
  .seg button{border:0;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;padding:6px 14px;color:var(--ink-soft);transition:background .15s,color .15s}

  header{border-bottom:3px double var(--ink);padding:52px 0 34px;margin-bottom:8px}

  h1{font-size:40px;line-height:1.2;margin:0 0 22px;font-weight:800;letter-spacing:-.02em}
  .standfirst{font-size:20px;color:var(--ink-soft);margin:0 0 26px;line-height:1.55}
  .byline{font-size:13px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:8px 18px;border-top:1px solid var(--rule);padding-top:16px}
  .byline span b{color:var(--ink);font-weight:600}
  section{padding:30px 0}
  .sec-num{font-size:13px;font-weight:700;color:var(--wine);letter-spacing:.04em}
  h2{font-size:27px;margin:4px 0 18px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
  p{margin:0 0 18px}
  a{color:var(--wine)}

  .abstract .lbl{font-size:12px;letter-spacing:.08em;color:var(--wine);font-weight:700;margin-bottom:10px}
  .abstract p:last-child{margin-bottom:0}
  .headline-metric{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap;margin:26px 0;padding:24px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .hm-big{font-size:64px;font-weight:800;color:var(--ink);letter-spacing:-.03em;line-height:1}
  .hm-arrow{font-size:30px;color:var(--wine)}
  .hm-label{font-size:14px;color:var(--ink-soft);line-height:1.5;max-width:300px}
  figure{margin:30px 0;background:#fff;border:1px solid var(--paper-edge);padding:22px 22px 16px}
  figcaption{font-size:13px;color:var(--ink-soft);line-height:1.55;margin-top:14px;padding-top:12px;border-top:1px solid var(--paper-edge)}
  figcaption b{color:var(--ink);font-weight:600}
  .fig-title{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--ink)}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .grid{stroke:var(--paper-edge);stroke-width:1}
  .tick-txt{font-size:11px;fill:var(--ink-soft)}
  .bar-lbl{font-size:12px;fill:var(--ink)}
  .val-lbl{font-size:12px;font-weight:700;fill:var(--ink)}
  table{border-collapse:collapse;width:100%;margin:24px 0;font-size:15px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--paper-edge)}
  thead th{border-bottom:2px solid var(--ink);font-size:12px;letter-spacing:.03em;color:var(--ink-soft)}
  td.num{font-variant-numeric:tabular-nums;text-align:right}
  tr.highlight td{background:var(--wine-soft);font-weight:700}
  .drivers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}
  .driver-col{background:#fff;border:1px solid var(--paper-edge);padding:16px 18px}

  .driver-col.up h4{color:var(--up)}.driver-col.down h4{color:var(--down)}
  .driver-col ul{margin:0;padding-left:18px;font-size:14.5px}
  .driver-col li{margin-bottom:7px}
  .pull{font-size:22px;line-height:1.45;color:var(--ink);border-left:3px solid var(--gold);padding:4px 0 4px 22px;margin:30px 0}
  .method{background:#fdfcfa;border:1px dashed var(--rule);padding:18px 22px;font-size:14.5px;color:var(--ink-soft);line-height:1.65}
  .method code{background:var(--paper-edge);padding:1px 5px;border-radius:3px;font-size:13px}
  footer{border-top:3px double var(--ink);margin-top:40px;padding:30px 0 80px;font-size:13px;color:var(--ink-soft)}
  @media (max-width:620px){body{font-size:17px}h1{font-size:29px}.hm-big{font-size:46px}.drivers{grid-template-columns:1fr}.controls-inner{gap:12px;padding:8px 20px}.seg button{padding:6px 11px;font-size:12px}}
  @media (prefers-reduced-motion:no-preference){.reveal{opacity:0;transform:translateY(12px);transition:opacity .6s ease,transform .6s ease}.reveal.in{opacity:1;transform:none}}

<script>
(function(){
"use strict";
var UI={ui_lang:{ko:"언어",en:"Language"}};

var C={
 kicker:{ko:"Empire Flippers · 지도학습 회귀 연구",en:"Empire Flippers · Supervised Regression Study"},
 title:{ko:"무엇이 온라인 사업의 가치 배수를 끌어올리는가?",en:"What drives an online business's valuation multiple?"},
 standfirst:{ko:"순익은 가격을 정하지만 같은 순익을 내는 두 사업도 배수는 다를 수 있다. 순익 이외의 다른 요인은 무엇으로 설명되는지 확인하기 위해 재무 지표, 성장 추세, 매물 설명 텍스트를 결합하여 매물 2,848개를 분석하였다.",
   en:"Profit sets the price, yet two businesses with the same profit can carry different multiples. To find what explains the rest, this study combines financial metrics, growth trends, and listing text across 2,848 listings."},
 byline:{ko:[["데이터","Empire Flippers 공개 API"],["과제","연간 호가 배수 예측"],["표본","매물 2,848개"],["방법","5-겹 교차검증"]],
   en:[["Data","Empire Flippers public API"],["Task","Predict annual listing multiple"],["n","2,848 listings"],["Method","5-fold cross-validation"]]},
 footer:{ko:"workshop-2026 · 온라인 사업 가치 배수 예측 · 데이터: Empire Flippers 공개 API · 투자 조언이 아니며, 제시된 배수는 모델 추정치이지 감정가가 아니다.",
   en:"workshop-2026 · Predicting online-business valuation multiples · Data: Empire Flippers public API · Not financial advice; multiples reported are model estimates, not appraisals."}
};

var SECTIONS=[
 {type:"abstract",body:{
  ko:"온라인 사업의 가치 배수(= 판매가 / 연간 순익)는 측정 가능한 펀더멘털과 그렇지 않은 요인을 통해 함께 결정된다. 본 연구는 매물의 재무/운영 지표, 성장 추세, 자유 서술 텍스트로 배수를 예측한다. 재무, 범주형 특징만 쓴 GradientBoosting 모델은 로그 배수 분산의 40%를 설명한다. 성장 추세 특징을 더하면 45%로, 텍스트 문장 임베딩을 더하면 독립적으로 비슷한 폭만큼 오른다. 두 신호가 거의 겹치지 않아 결합하면 R² 0.48, 평균절대오차 0.377배에 도달한다. 대조 실험으로 텍스트 기여가 사실임을 확인했고(같은 형태의 무작위 벡터는 성능을 낮춤), 차원 스윕(dimension sweep)으로 임베딩 차원이나 모델 크기를 키운다고 이 규모에서 예측이 반드시 나아지지는 않음을 보였다.",
  en:"The valuation multiple of an online business (= sale price / annual profit) is set jointly by measurable fundamentals and softer factors. This study predicts the multiple from a listing's financial and operating metrics, growth trend, and free-text description. A GradientBoosting model on financial and categorical features alone explains 40% of the variance in log-multiple. Adding growth-trend features lifts it to 45%; adding sentence embeddings of the listing text lifts it independently by a similar margin. Because the two signals barely overlap, combining them reaches R² 0.48 and a mean absolute error of 0.377×. A control confirms the text gain is real (random vectors of the same shape lower performance), and a dimension sweep shows that enlarging the embedding dimension or the model does not reliably improve prediction at this scale."}},

 {type:"text",num:"동기",label:true,
  h:{ko:"연구 동기",en:"Motivation"},
  p:{ko:["이 연구는 한국이커머스페어(KOEFA)에서 접한 ‘이숲(ESOOP)’이라는 서비스에서 출발하였다. 이숲은 온라인 스토어의 가치를 추정하는 국내 이커머스 M&A 플랫폼으로, 판매자의 판매 채널을 연동하면 국내 마켓 데이터로 학습한 AI 모델이 매출, 채널 수수료, 광고비를 수집해 가치평가액을 산출하고 매수인에게 넘기는 양수도 과정을 지원한다.",
        "여기서 이 프로젝트가 다루는 내용에 대한 궁금한 점이 생겼다. 모델이 온라인 사업의 가치를 추정할 수 있다면, 실제로 어떤 요인을 분석하는지와 그 가치 중 순익만으로 설명되는 부분은 얼마이고 나머지는 무엇인지에 대한 것이었다. 가격이 아니라 배수가 바로 그 ‘나머지’를 분리해 낸다. 같은 순익을 내는 두 사업도 배수는 크게 다를 수 있기 때문이다.",
        "이숲은 국내 마켓에서 작동하며 그 원천 수치는 비공개다. 같은 질문을 공개적으로 검증 가능한 데이터로 다루기 위해, 이 프로젝트는 대신 공개 Empire Flippers API를 쓴다. 인증이 필요 없는 문서화된 엔드포인트를 가진 글로벌 온라인 사업 마켓플레이스다."],
     en:["This study began with a service encountered at the Korea E-commerce Fair (KOEFA): ESOOP. ESOOP is a domestic e-commerce M&A platform that estimates the value of an online store — link a seller's sales channels, and an AI model trained on domestic marketplace data collects revenue, channel fees, and ad spend to produce a valuation and support the handover to a buyer.",
        "That raised the question this project examines. If a model can estimate what an online business is worth, what does it actually read, how much of that value is explained by profit alone, and what is the rest? The multiple, not the price, isolates that 'rest' — because two businesses with identical profit can carry very different multiples.",
        "ESOOP operates on Korean marketplaces, and its underlying figures are private. To study the same question on openly verifiable data, this project uses the public Empire Flippers API instead — a global online-business marketplace with a documented, no-auth endpoint."]},
  method:{ko:"이 연구는 공개 데이터를 이용한 독립 실험으로 이숲과 연관이 없음을 밝히며, 해당 플랫폼은 질문의 계기였을 뿐 데이터 출처가 아님을 밝힌다.",
     en:"This is an independent study on public data with no affiliation to ESOOP; the platform was the prompt for the question, not a source of data."}},

 {type:"text",num:"01",lede:true,
  h:{ko:"숫자 뒤에 숨은 질문",en:"The question behind the number"},
  p:{ko:["가치 배수에는 온라인 사업 시장이 축약되어 있다. 예를 들어 연 1억 원을 버는 플랫폼이 3억 원에 팔리면 3배다. 배수에는 그 사업이 얼마나 견고하고, 이전 가능하며, 유망한지를 인수자가 판단하는 정도가 응축되어 있다.",
        "순익이 바탕을 드러낸다면 배수는 프리미엄을 드러내기에 가격보다 흥미로운 예측 대상이다. 순익이 크면 가격도 크기에 가격은 대체로 기계적이다. 배수는 규모를 걷어내고 그 나머지에 해당하는 부분을 설명한다. 이를 예측하고, 더 중요하게는 설명 가능(explainable)하다면, 시장이 순수 수익을 넘어 어떤 부분에 보상하는지 확인할 수 있다.",
        "배수는 호가 배수(인계자가 희망하는 값)와 성사 배수(인수자가 희망하는 값) 두 가지로 측정된다. 성사 배수가 더 품질 좋은 라벨이지만 공개 API 호출 결과 판매된 매물에도 응답에 포함되지 않았다. 따라서 호가 배수를 타깃으로 삼아 유용한 부수 효과를 창출하였다. 판매된 매물도 재무와 텍스트가 온전히 남아 표본이 총 2,857개(판매 중 183 + 판매 완료 2,674)로 늘었고, 이 중 타깃이 결측이거나 양수가 아닌 9개를 제거해 2,848개가 남았다."],
     en:["The valuation multiple compresses the online-business market into a single figure. If a platform earning ₩100M a year sells for ₩300M, that is a 3× multiple. The multiple encodes how durable, how transferable, and how promising a buyer judges the business to be.",
        "If profit reveals the base, the multiple reveals the premium — which makes it a more interesting prediction target than price. Larger profit means larger price, so price is largely mechanical. The multiple strips scale away and speaks to what remains. If we can predict it and, more importantly, explain it, we can see what the market rewards beyond raw earnings.",
        "The multiple is measured two ways: the listing multiple (what the seller hopes for) and the sale multiple (what the buyer hopes for). The sale multiple is the higher-quality label, but a call to the public API showed it is absent from the response even for sold listings. So the listing multiple became the target — with a useful side effect: sold listings retain full financials and text, enlarging the pool to 2,857 (183 for sale + 2,674 sold), of which 2,848 remain after removing 9 with a missing or non-positive target."]},
  method:{ko:"누수 방지. 배수 ≈ 가격 ÷ 순익이므로, 가격 필드를 넣으면 모델이 답을 역산할 수 있다. listing_price, unpriced, listing_multiple 필드를 코드에서 제거하고, 특징 테이블에 절대 남지 않도록 단언(assert)한다. 순익 자체는 규모 신호로서 유지한다. 순익을 넘어 무엇이 중요한지가 핵심 질문이다.",
     en:"Leakage guard. Since multiple ≈ price ÷ profit, any price field lets the model back out the answer. The listing_price, unpriced, and listing_multiple fields are dropped in code, with an assertion that they never survive into the feature table. Profit itself is kept as a scale signal — what matters beyond profit is the core question."}},

 {type:"text",num:"02",headline:true,
  h:{ko:"기준선, 그리고 두 가지 추가",en:"A baseline, then two additions"},
  p:{ko:["모델링은 5-겹으로 진행되며, 각 단계를 동일한 교차검증 폴드로 비교해 모든 향상이 하나의 변화에 귀속되도록 설정하였다. 정규화 선형 모델(Ridge)과 GradientBoosting을 병렬 수행하며, 부스팅이 시종 앞섰다. 이 자체가 특징과 배수의 관계가 비선형(non-linear)임을 의미하는 정보이다.",
        "기준선은 재무 규모(로그 순익, 매출, 비용), 마진, 사업 연령, 노동 시간, 수익화 유형, 니치, 국가를 사용한다. 로그 배수 분산의 40%를 설명하며, 이는 실제 신호이지만 전부는 아니다. 나머지 60%에 두 가지가 추가적으로 개입한다."],
     en:["Modeling proceeds in 5 folds, with each stage compared on the same cross-validation folds so every gain is attributable to a single change. A regularized linear model (Ridge) and GradientBoosting run in parallel, and boosting leads throughout — itself a signal that the relationship between features and multiple is non-linear.",
        "The baseline uses financial scale (log profit, revenue, expenses), margins, business age, hours worked, monetization type, niche, and country. It explains 40% of the log-multiple variance — a real signal, but not the whole. Two additions intervene in the remaining 60%."]}},

 {type:"fig1"},

 {type:"text",num:"03",
  h:{ko:"텍스트가 진짜 기여했나, 아니면 그저 열이 늘어난 건가?",en:"Did the text really contribute, or did the columns just multiply?"},
  p:{ko:["텍스트 임베딩 50열을 더해 점수가 올랐다고 해서, 그것만으로 텍스트가 기여했다는 것을 의미하지는 않는다. 열이 늘면 순전한 유연성으로 점수가 오를 수 있기 때문이다. 둘을 분리하기 위해 진짜 임베딩을 정확히 같은 형태의 무작위 벡터로 바꿔 다시 돌리는 대조 실험을 수행하였다.",
        "무작위 벡터는 R²를 0.40에서 0.38로 낮췄고, 진짜 임베딩은 0.45로 높였다. 열 개수는 같은데 효과는 정반대였다 — 향상은 행렬의 너비가 아니라 텍스트 속 의미에서 온다. 매물이 기회와 리스크를 어떻게 서술하는지와는 무관하게, 재무 열에 없는 정보가 담겨 있다."],
     en:["That the score rose when 50 embedding columns were added does not, by itself, mean the text contributed — added columns can raise a score through sheer flexibility. To separate the two, a control replaced the real embeddings with random vectors of exactly the same shape and re-ran.",
        "The random vectors lowered R² from 0.40 to 0.38; the real embeddings raised it to 0.45. Same column count, opposite effect — the gain comes from meaning inside the text, not the width of the matrix. However a listing frames its opportunities and risks, it carries information the financial columns do not."]},
  pull:{ko:"열 개수는 같은데 효과는 정반대이다. 신호는 텍스트가 ‘무엇을 말하는가’에 해당하며, ‘많다’를 의미하지는 않는다.",
     en:"Same column count, opposite effect. The signal is in what the text says — not in there being more of it."}},

 {type:"text",num:"04",
  h:{ko:"크다고 무조건 좋은 것은 아니다",en:"Bigger is not automatically better"},
  p:{ko:["더 강한 임베딩 모델이 도움이 될지, 임베딩 차원을 더 많이 쓰면 나아질지에 대한 의문이 생겼고 이에 대한 실험을 추가로 수행한 결과, 두 답 모두 ‘많을수록 좋다’는 직관을 뒤집었다.",
        "모델 측면: MiniLM(384차원, 약 90MB, GPU에서 약 9초)을 Qwen3-0.6B(1024차원, 약 1.2GB, 약 8분)와 비교했다. 큰 모델이 근소하게 이겼다 — 결합 시 0.447 대 0.437 — 연산량은 약 50배였다. 차원 측면: Qwen 임베딩을 PCA로 5~300차원까지 줄여봤더니 뚜렷한 역U자가 그려졌다."],
     en:["Would a stronger embedding model help? Would more embedding dimensions help? Both experiments overturned the 'more is better' intuition.",
        "On the model: MiniLM (384-dim, ~90MB, ~9s on GPU) was compared against Qwen3-0.6B (1024-dim, ~1.2GB, ~8min). The larger model won by a hair — 0.447 vs 0.437 when fused — at roughly 50× the compute. On dimensions: reducing the Qwen embedding via PCA from 5 to 300 dimensions traced a clear inverted-U."]}},

 {type:"fig2"},

 {type:"text",num:"04b",noheadnum:true,h:{ko:"",en:""},
  p:{ko:["차원 축소가 원래 드러내던 부분이다. 소규모 데이터에서 압축은 속도 요령이 아닌 정규화이다. PCA가 30 이후로 버리는 성분은 대개 가치와 무관한 문체 및 주제 변이이고, 방치 시 모델이 학습하는 데이터에 노이즈가 껴 과적합이 발생하게 된다."],
     en:["This is what dimensionality reduction was meant to reveal. On small data, compression is not a speed trick but regularization. The components PCA discards past 30 are mostly style and topic variation unrelated to value; left in, they let noise into the training data and overfitting follows."]}},

 {type:"text",num:"05",
  h:{ko:"가장 유용한 열은 이미 데이터에 존재한다",en:"The most useful column was already in the data"},
  p:{ko:["텍스트를 꺼내기 전에도 이미 응답에는 기준선이 쓰지 않은 필드들이 존재하였다. 이 중 성장(순익, 매출 추세)과 트래픽(페이지뷰, 순방문자)이 유망한 요인으로 짐작되었고 이 두 가지를 추가로 이용한 실험을 수행한 결과, 중요한 것은 성장 추세 하나뿐이었다.",
        "성장 추세는 본 연구에서 가장 유의미한 특징으로, 표 기준선을 0.40에서 0.45로 끌어올려 텍스트 파이프라인 전체와 유사한 추세를 보였다. 반면 트래픽 규모는 영향이 미미했다.",
        "시장은 관객이 아니라 궤적에 기여하는 것으로 해석된다. 방문자는 많지만 그 방문자의 가치는 이미 순익에 반영돼 있기 때문에, 그에 걸맞은 수익이 없는 사업은 프리미엄을 받지 못한다."],
     en:["Even before reaching for text, the response held fields the baseline had not used. Among them, growth (profit and revenue trend) and traffic (page views, unique visitors) looked promising; an experiment added both, and only growth trend mattered.",
        "Growth trend was the single most consequential feature in this study, lifting the tabular baseline from 0.40 to 0.45 — a gain on par with the entire text pipeline. Traffic volume, by contrast, made little difference.",
        "The market, it seems, rewards a trajectory rather than an audience. Visitors may be many, but their value is already captured in profit, so a business with traffic but no matching earnings earns no premium."]},
  pull:{ko:"시장은 관객이 아니라 궤적에 값을 치른다. 성장은 프리미엄을 얻었고, 트래픽은 그러지 못했다.",
     en:"The market pays for a trajectory, not an audience. Growth earned a premium; traffic did not."}},

 {type:"text",num:"06",drivers:true,
  h:{ko:"모델이 무엇에 보상하도록 학습했나",en:"What the model learned to reward"},
  p:{ko:["목표의 절반은 예측 점수이고, 나머지 절반은 설명이다. 최종 모델에 SHAP 기여도를 적용하면 사각지대에서 어떤 요인이 예측 배수를 올리고 내리는지에 대한 방향성 진술로 변화한다."],
     en:["Half the goal is a predictive score; the other half is explanation. Applying SHAP attributions to the final model turns the blind spot into directional statements about which factors raise or lower the predicted multiple."]},
  after:{ko:["방향은 직관적이며, 이는 지루함이 아니라 안심의 근거가 된다 — 모델이 시장의 실제 논리를 복원했다는 뜻이기 때문이다. 반복 매출과 법적 방어력(상표)은 프리미엄을 부르고, 오래 안 팔린 매물은 가치가 감소한다. 시장 체류 기간이 수요 약세의 공개 신호로 작동하는 것이다.",
        "오차는 불균일하다. 사업 규모가 클수록 커지고(큰 사업일수록 가격이 특수함), SaaS에서 가장 높다 — 가장 높은 배수를 부르는 바로 그 분야다. 보상이 높을수록 분산도 높게 나타나며, 그 외 잔차는 0을 중심으로 대칭이며 체계적 편향이 없다."],
     en:["The directions are intuitive, which is a reason for reassurance rather than boredom — it means the model recovered the market's real logic. Recurring revenue and legal defensibility (a trademark) command premiums, while listings that sit unsold lose value, their time on the marketplace acting as a public signal of weak demand.",
        "Error is uneven. It grows with business size (larger businesses are more idiosyncratically priced) and is highest for SaaS — the very category commanding the highest multiples. Higher reward brings higher variance; otherwise residuals are symmetric about zero with no systematic bias."]}},

 {type:"table",num:"07",
  h:{ko:"전체 결과",en:"Full results"},
  after:{ko:"평균 0.574배의 오차를 드러내는 기준선에서, 최종 모델은 오차를 대략 3분의 1로 줄인다. 천장은 실재한다. 최종 성사 배수를 정하는 많은 것 — 구매자 경쟁, 협상, 시장 분위기 — 은 이 데이터에 없고, 기록되지 않은 것을 되살릴 모델은 없다.",
     en:"From a baseline that misses by 0.574× on average, the final model cuts the error by roughly a third. The ceiling is real: much of what sets the final sale multiple — buyer competition, negotiation, market mood — is absent from this data, and no model can recover what was never recorded."}},

 {type:"text",num:"08",
  h:{ko:"연구 한계",en:"Limitations"},
  p:{ko:["본 연구의 결론은 몇 가지 한계를 감안해야 한다.",
        "첫째, 타깃은 성사 배수가 아니라 호가 배수다. 공개 API에 실제 체결가가 없어, 모델이 예측하는 것은 시장이 실제로 체결한 값이 아니라 매도자가 희망하는 값이다. 협상으로 감소하는 폭은 데이터에 담기지 않으므로, 여기서 말하는 ‘배수’는 기대가에 가깝다.",
        "둘째, 설명력에는 뚜렷한 천장이 나타난다. 최종 모델의 R²는 0.48로, 배수 변동의 절반 가량은 여전히 설명되지 않는다. 구매자 경쟁, 협상, 그날의 시장 분위기처럼 애초에 기록되지 않은 요인은 모델 성능 향상을 통해 복원되는 영역이 아니다. 남은 절반은 방법의 부족이 아닌 데이터의 한계에 그 원인이 있다.",
        "셋째, 도메인 이전은 검증되지 않았다. 이 연구는 국내 이커머스에서 착안했지만, 실제 데이터는 영어권 글로벌 매물이다. 언어, 시장, 수수료 구조가 다른 국내 마켓에 이 결과가 그대로 옮겨지리라는 보장은 없다.",
        "그 밖에도 몇 가지가 있다. 데이터는 단일 플랫폼(Empire Flippers)의 특정 시점 스냅숏 한 장이라 선택 편향과 시점 의존성이 있고, 유효 표본 2,848건은 크지 않아 임베딩 차원을 늘리면 과적합이 나타났다. SHAP 기여도는 상관을 보여줄 뿐 인과를 증명하지 않는다.",
        "오차는 사업 규모와 함께 커지고 SaaS에서 가장 높은데, 정작 그 분야가 가장 높은 배수를 부른다 — 가장 값비싼 구간에서 예측이 가장 불안정함을 의미한다."],
     en:["The conclusions of this study should be read against several limitations.",
        "First, the target is the listing multiple, not the sale multiple. Because the public API carries no realized price, the model predicts what the seller hopes for, not what the market actually settled on. Whatever negotiation removes is absent from the data, so the 'multiple' here is closer to an asking expectation.",
        "Second, there is a clear ceiling on explanatory power. The final model reaches R² 0.48, leaving roughly half of the variation in the multiple unexplained. Buyer competition, negotiation, and the mood of the market on a given day were never recorded, and this is not a region recoverable by improving the model. The missing half owes to a limit of the data, not a shortfall of method.",
        "Third, transfer across domains is untested. The study was prompted by Korean e-commerce, but the data is an English-language global marketplace. There is no guarantee these findings carry over to a domestic market with a different language, buyer base, and fee structure.",
        "Several narrower caveats remain. The data is a single-platform snapshot (Empire Flippers) from one point in time, carrying selection bias and time dependence; the 2,848 valid rows are a small sample, which is why adding embedding dimensions produced overfitting. SHAP attributions show association, not causation.",
        "Error grows with business size and is highest for SaaS — the very category commanding the highest multiples — meaning prediction is least stable exactly where the stakes are highest."]}},

 {type:"text",num:"09",
  h:{ko:"이 연구의 결론",en:"What this study concludes"},
  p:{ko:["순익 수준을 넘어, 온라인 사업의 배수에 영향을 미치는 요인은 세 가지이다. 첫째 성장하고 있는가, 둘째 모델이 견고하고 방어 가능한가, 셋째 자기 설명이 전망과 리스크에 대해 무엇을 말하는가. 성장 추세와 매물 텍스트는 거의 대등하고, 같은 질문에 대한 정량적/정성적 두 관점에서 보완적인 기여자로 작동한다.",
        "방법론적 발견도 실질적 발견만큼 유용하다. 더 큰 임베딩 모델은 이득이 적었고, 차원을 늘리면 오히려 해로웠으며, 잘 고른 수치 특징 하나가 텍스트 파이프라인 전체와 맞먹었다. 수천 행짜리 데이터에서 모델 크기, 차원, 특징 수에 대한 절제는 타협이 아니라 옳은 선택이었다."],
     en:["Beyond the level of profit, three things move an online business's multiple: first, whether it is growing; second, whether the business is durable and defensible; third, what its own description says about prospects and risks. Growth trend and listing text are near-equals, acting as complementary contributors — a quantitative and a qualitative view of the same question.",
        "The methodological findings are as useful as the substantive ones. A larger embedding model bought little, adding dimensions actively hurt, and one well-chosen numeric feature matched the entire text pipeline. On data of a few thousand rows, restraint in model size, dimensionality, and feature count was not a compromise but the right choice."]},
  method:{ko:"재현성. 모든 결과는 고정 시드의 5-겹 교차검증으로, 평가를 일정하게 두고 특징 세트만 바꿔 비교한다. 데이터는 공식 공개 API에서 초당 1회로 수집했고, 원문 텍스트는 비공개로 공개하지 않으며, 가공 임베딩과 집계 결과만 공유한다. 전체 코드와 파이프라인은 저장소 README에 있다.",
     en:"Reproducibility. All results use 5-fold cross-validation with a fixed seed, holding evaluation constant and varying only the feature set. Data was collected from the official public API at one request per second; raw text is kept private and not published; only derived embeddings and aggregate results are shared. Full code and pipeline are in the repository README."}}
];

var ABSTRACT_LBL={ko:"초록",en:"Abstract"};

var state={lang:"ko"};
function pick(o){return o?o[state.lang]:"";}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}

function renderMast(){
 document.querySelector('[data-slot="kicker"]').textContent=pick(C.kicker);
 document.querySelector('[data-slot="title"]').textContent=pick(C.title);
 document.querySelector('[data-slot="standfirst"]').textContent=pick(C.standfirst);
 var by=document.querySelector('[data-slot="byline"]');by.innerHTML="";
 pick(C.byline).forEach(function(pr){by.appendChild(el("span",null,"<b>"+pr[0]+"</b> "+pr[1]));});
 document.querySelector('[data-slot="footer"]').textContent=pick(C.footer);
 document.querySelectorAll("[data-t]").forEach(function(n){var k=n.getAttribute("data-t");if(UI[k])n.textContent=UI[k][state.lang];});
 document.documentElement.lang=state.lang;document.title=pick(C.title);
}

function renderReport(){
 var root=document.getElementById("report");root.innerHTML="";
 SECTIONS.forEach(function(s){
  var sec=el("section","reveal");
  if(s.type==="abstract"){var box=el("div","abstract");box.appendChild(el("div","lbl",ABSTRACT_LBL[state.lang]));box.appendChild(el("p",null,pick(s.body)));sec.appendChild(box);root.appendChild(sec);return;}
  if(s.type==="text"||s.type==="table"){
    if(!s.label&&!s.noheadnum&&s.num)sec.appendChild(el("div","sec-num",s.num));
    var ht=pick(s.h);
    if(ht)sec.appendChild(el("h2",null,ht));
  }
  if(s.type==="text"){
   (pick(s.p)||[]).forEach(function(pa,i){sec.appendChild(el("p",(i===0&&s.lede)?"lede":null,pa));});
   if(s.pull)sec.appendChild(el("div","pull",pick(s.pull)));
   if(s.drivers)sec.appendChild(buildDrivers());
   if(s.after)pick(s.after).forEach(function(pa){sec.appendChild(el("p",null,pa));});
   if(s.method)sec.appendChild(el("div","method",pick(s.method)));
   if(s.headline)sec.appendChild(buildHeadline());
  }
  if(s.type==="fig1")sec.appendChild(buildFigure("fig-scoreboard",FIG.fig1_title[state.lang],pick(FIG.fig1_cap)));
  if(s.type==="fig2")sec.appendChild(buildFigure("fig-pca",FIG.fig2_title[state.lang],pick(FIG.fig2_cap)));
  if(s.type==="table"){sec.appendChild(buildTable());if(s.after)sec.appendChild(el("p",null,pick(s.after)));}
  root.appendChild(sec);
 });
 armFigure("fig-scoreboard",drawScoreboard);
 armFigure("fig-pca",drawPca);
 initReveal();
}

function buildHeadline(){var w=el("div","headline-metric");w.appendChild(el("span","hm-big","0.40"));w.appendChild(el("span","hm-arrow","→"));var b=el("span","hm-big","0.48");b.style.color="var(--wine)";w.appendChild(b);w.appendChild(el("span","hm-label",pick(FIG.hm_label)));return w;}
function buildFigure(id,title,cap){var f=el("figure");f.appendChild(el("div","fig-title",title));var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("id",id);svg.setAttribute("viewBox",id==="fig-pca"?"0 0 680 320":"0 0 680 300");svg.setAttribute("role","img");f.appendChild(svg);f.appendChild(el("figcaption",null,cap));return f;}
function buildDrivers(){var w=el("div","drivers");var u=el("div","driver-col up");u.appendChild(el("h4",null,DRIVERS.up_title[state.lang]));var ul=el("ul");pick(DRIVERS.up).forEach(function(t){ul.appendChild(el("li",null,t));});u.appendChild(ul);var d=el("div","driver-col down");d.appendChild(el("h4",null,DRIVERS.down_title[state.lang]));var dl=el("ul");pick(DRIVERS.down).forEach(function(t){dl.appendChild(el("li",null,t));});d.appendChild(dl);w.appendChild(u);w.appendChild(d);return w;}
function buildTable(){var tb=el("table");var head=TABLE.head[state.lang];var th=el("thead");var tr=el("tr");head.forEach(function(h,i){tr.appendChild(el("th",i>0?"num":null,h));});th.appendChild(tr);tb.appendChild(th);var tbody=el("tbody");pick(TABLE.rows).forEach(function(r,ri){var t=el("tr",(ri===TABLE.highlightRow-1)?"highlight":null);r.forEach(function(c,ci){t.appendChild(el("td",ci>0?"num":null,c));});tbody.appendChild(t);});tb.appendChild(tbody);return tb;}

var drawn={};
function armFigure(id,fn){var e=document.getElementById(id);if(!e)return;drawn[id]=false;if(!("IntersectionObserver"in window)){fn(e);drawn[id]=true;return;}var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting&&!drawn[id]){fn(x.target);drawn[id]=true;io.disconnect();}});},{threshold:.3});io.observe(e);}
function NS(){return"http://www.w3.org/2000/svg";}
function mk(t,a){var e=document.createElementNS(NS(),t);for(var k in a)e.setAttribute(k,a[k]);return e;}

function drawScoreboard(svg){svg.innerHTML="";var W=680,H=300,padR=60,padT=10,padB=34;var padL=state.lang==="ko"?150:200;
 var data=[{label:state.lang==="ko"?"재무만":"financial",r2:.400,hi:false},{label:state.lang==="ko"?"+ 텍스트":"+ text",r2:.447,hi:false},{label:state.lang==="ko"?"+ 성장":"+ growth",r2:.447,hi:false},{label:state.lang==="ko"?"+ 성장 & 텍스트":"+ growth & text",r2:.482,hi:true}];
 var xMax=.55,plotW=W-padL-padR,rowH=(H-padT-padB)/data.length,barH=rowH*.56;function x(v){return padL+(v/xMax)*plotW;}
 [0,.1,.2,.3,.4,.5].forEach(function(t){var gx=x(t);svg.appendChild(mk("line",{x1:gx,x2:gx,y1:padT,y2:H-padB,"class":"grid"}));var tx=mk("text",{x:gx,y:H-padB+18,"text-anchor":"middle","class":"tick-txt"});tx.textContent=t.toFixed(1);svg.appendChild(tx);});
 data.forEach(function(d,i){var cy=padT+i*rowH+rowH/2;var lab=mk("text",{x:padL-12,y:cy+4,"text-anchor":"end","class":"bar-lbl"});if(d.hi)lab.setAttribute("font-weight","700");lab.textContent=d.label;svg.appendChild(lab);var bar=mk("rect",{x:padL,y:cy-barH/2,height:barH,width:0,fill:d.hi?"#7c2d3a":"#c3aa9e"});svg.appendChild(bar);var tW=x(d.r2)-padL;var vl=mk("text",{y:cy+4,"class":"val-lbl",x:padL+6,opacity:"0"});vl.textContent=d.r2.toFixed(3);svg.appendChild(vl);var st=null,dur=700+i*90;function step(ts){if(!st)st=ts;var p=Math.min((ts-st)/dur,1),e=1-Math.pow(1-p,3);bar.setAttribute("width",tW*e);if(p>.6){vl.setAttribute("opacity",(p-.6)/.4);vl.setAttribute("x",padL+tW*e+8);}if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);});
}

function drawPca(svg){svg.innerHTML="";var W=680,H=320,padL=54,padR=24,padT=20,padB=46;
 var pts=[{d:5,r2:.429},{d:10,r2:.434},{d:20,r2:.445},{d:30,r2:.448},{d:40,r2:.447},{d:50,r2:.446},{d:100,r2:.438},{d:200,r2:.431},{d:300,r2:.431}];
 var yMin=.40,yMax=.46,plotW=W-padL-padR,plotH=H-padT-padB;function x(i){return padL+(i/(pts.length-1))*plotW;}function y(v){return padT+(1-(v-yMin)/(yMax-yMin))*plotH;}
 [.40,.42,.44,.46].forEach(function(t){var gy=y(t);svg.appendChild(mk("line",{x1:padL,x2:W-padR,y1:gy,y2:gy,"class":"grid"}));var tx=mk("text",{x:padL-10,y:gy+4,"text-anchor":"end","class":"tick-txt"});tx.textContent=t.toFixed(2);svg.appendChild(tx);});
 pts.forEach(function(p,i){var tx=mk("text",{x:x(i),y:H-padB+18,"text-anchor":"middle","class":"tick-txt"});tx.textContent=p.d;svg.appendChild(tx);});
 var xt=mk("text",{x:padL+plotW/2,y:H-6,"text-anchor":"middle","class":"tick-txt","font-weight":"700"});xt.textContent=state.lang==="ko"?"남긴 PCA 차원 수":"PCA dimensions kept";svg.appendChild(xt);
 var refY=y(.446);svg.appendChild(mk("line",{x1:padL,x2:W-padR,y1:refY,y2:refY,stroke:"#a9761a","stroke-width":"1","stroke-dasharray":"4 4"}));
 var dp=pts.map(function(p,i){return(i?"L":"M")+x(i)+" "+y(p.r2);}).join(" ");var path=mk("path",{d:dp,fill:"none",stroke:"#7c2d3a","stroke-width":"2.5","stroke-linejoin":"round"});svg.appendChild(path);var len=path.getTotalLength();path.style.strokeDasharray=len;path.style.strokeDashoffset=len;
 pts.forEach(function(p,i){var c=mk("circle",{cx:x(i),cy:y(p.r2),r:p.d===30?5.5:3.5,fill:p.d===30?"#7c2d3a":"#fff",stroke:"#7c2d3a","stroke-width":"2",opacity:"0"});svg.appendChild(c);setTimeout(function(){c.setAttribute("opacity","1");},700+i*70);});
 var ann=mk("text",{x:x(3),y:y(.448)-12,"text-anchor":"middle","class":"val-lbl",fill:"#7c2d3a",opacity:"0"});ann.textContent=PEAK_LBL[state.lang];svg.appendChild(ann);setTimeout(function(){ann.setAttribute("opacity","1");},1500);
 requestAnimationFrame(function(){path.style.transition="stroke-dashoffset 1.4s ease";path.style.strokeDashoffset=0;});
}

var revObs=null;
function initReveal(){var els=document.querySelectorAll(".reveal");if(!("IntersectionObserver"in window)){els.forEach(function(e){e.classList.add("in");});return;}if(revObs)revObs.disconnect();revObs=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){x.target.classList.add("in");revObs.unobserve(x.target);}});},{threshold:.1});els.forEach(function(e){revObs.observe(e);});}

window.setLang=function(l){state.lang=l;document.getElementById("lang-ko").classList.toggle("active",l==="ko");document.getElementById("lang-en").classList.toggle("active",l==="en");renderMast();renderReport();};

document.addEventListener("DOMContentLoaded",function(){renderMast();renderReport();});
})();
</script>
